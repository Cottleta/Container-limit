# ContainerLimit configuration
#
# Each container type has its own list of limits:
#
# containers:
#   <CONTAINER_TYPE>:
#     <MATERIAL_NAME>: <max total amount allowed in ONE container of that type>
#
# The number is the total count of that item across ALL slots of a single container
# (e.g. ENDER_PEARL: 32 allows two full stacks, or 32 single pearls spread around).
# Use 0 to block the item completely.
#
# Container types:
#   ENDER_CHEST, CHEST (chests, trapped chests, double chests, chest minecarts, chest boats),
#   BARREL, SHULKER_BOX, HOPPER (also hopper minecarts), DISPENSER, DROPPER,
#   FURNACE, BLAST_FURNACE, SMOKER, BREWING, CRAFTER (1.21+)
#   BUNDLE (special: limits what can be put INSIDE each bundle, including colored bundles)
#
# Item keys can be:
#   ELYTRA          one item. Names: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
#   WOOL            a Minecraft tag = every color at once. Other useful tags: BEDS, BANNERS, CANDLES,
#                   WOOL_CARPETS, TERRACOTTA, SHULKER_BOXES, LOGS, PLANKS, SIGNS...
#                   (full list: https://minecraft.wiki/w/Tag)
#   '*_WOOL'        a wildcard over item names. MUST be in quotes because of the *.
#                   '*SHULKER_BOX' matches all 17 shulker boxes, '*_GLASS*' all stained glass + panes.
#
#   'custom:lifestealz:customitemtype=heart'
#                   a custom item from another plugin, recognised by the hidden tag that plugin puts
#                   on it. Hold the item and run /climit hand to see its tags; click one to copy
#                   the ready-made line. 'custom:<plugin>:<tag>' (without =) matches any value.
#                   A custom item never counts as its base item: with the line above, NETHER_STAR
#                   only means real nether stars, not hearts.
#
# A tag or wildcard is ONE combined limit: WOOL: 64 means 64 wool in total, any mix of colors.
# If an item is covered by several entries, all of them apply (e.g. WOOL: 64 and RED_WOOL: 0).
containers:
  ENDER_CHEST:
    ELYTRA: 1
    TOTEM_OF_UNDYING: 2
    ENCHANTED_GOLDEN_APPLE: 0
    # WOOL: 64
    # '*SHULKER_BOX': 0
    # 'custom:lifestealz:customitemtype=heart': 0

  # Examples, remove the # to enable:
  # CHEST:
  #   ELYTRA: 0
  #   NETHERITE_BLOCK: 16
  # BARREL:
  #   ELYTRA: 0
  # SHULKER_BOX:
  #   TOTEM_OF_UNDYING: 1
  # BUNDLE:
  #   TOTEM_OF_UNDYING: 0
  #   ENDER_PEARL: 8

# Also count items stored inside shulker boxes, bundles and other container items.
# Without this, players can smuggle blocked items in by putting them in a shulker box first.
count-container-contents: true

# Skip custom menus made by other plugins (e.g. a CHEST-type GUI that isn't a real chest).
# Ender chests are always checked.
ignore-plugin-inventories: true

# Permissions (none are given to ops by default):
#   containerlimit.bypass               - ignore all limits
#   containerlimit.bypass.<type>        - ignore limits for one container, e.g. containerlimit.bypass.chest

messages:
  prefix: "&8[&5ContainerLimit&8] "
  # {item} = item name, {limit} = configured limit, {container} = container type (e.g. "ender chest")
  blocked: "&c{item} is not allowed in this {container}."
  limit: "&cYou can only store {limit}x {item} in one {container}."
  reloaded: "&aConfig reloaded. {count} item limit(s) loaded."
  reload-error: "&cconfig.yml has an error, nothing was reloaded:"
  usage: "&7Usage: /climit <reload|list|hand>"
  list-header: "&7{container}:"
  list-entry: "&8- &f{item}&7: {limit}"
  list-empty: "&7No limits configured."
